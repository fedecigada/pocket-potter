<!doctype html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Potter - Gestione Account</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand ms-3" href="dashboard.html">Pocket Potter</a>
        <span id="welcomeMessage" class="navbar-text ms-2"></span>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item me-3">
              <span class="navbar-text">
                Crediti: <span id="userCredits" class="fw-bold">0</span>
              </span>
            </li>
            <li class="nav-item dropdown">
              <button
                class="nav-link dropdown-toggle btn"
                type="button"
                id="accountDropdown"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Account
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="gestione-account.html"
                    >Gestione Account</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="#" onclick="handleLogout()"
                    >Logout</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <div id="accountSection" class="bg-body-tertiary rounded p-4">
        <h2 class="mb-4">Il tuo Account</h2>
        <div class="row">
          <div class="col-md-6 mb-4">
            <h5>Informazioni Personali</h5>
            <p><strong>Username:</strong> <span id="userUsername"></span></p>
            <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <p>
              <strong>Casata Preferita:</strong>
              <span id="userHouse"></span>
            </p>
          </div>
          <div class="col-md-6 mb-4">
            <h5>Statistiche Collezione</h5>
            <p><strong>Crediti:</strong> <span id="detailCredits"></span></p>
            <p><strong>Carte Totali:</strong> <span id="totalCards"></span></p>
            <p><strong>Carte Uniche:</strong> <span id="uniqueCards"></span></p>
            <p>
              <strong>Carte Duplicate:</strong>
              <span id="duplicateCards"></span>
            </p>
            <p>
              <strong>Completamento Album:</strong>
              <span id="completionPercentage"></span>%
            </p>
          </div>
        </div>
        <div class="mt-2">
          <button class="btn btn-primary me-2" onclick="showEditForm()">
            Modifica Account
          </button>
          <button class="btn btn-danger" onclick="confirmDelete()">
            Elimina Account
          </button>
        </div>
      </div>

      <div
        id="editSection"
        class="bg-body-tertiary rounded p-4"
        style="display: none"
      >
        <h2 class="mb-4">Modifica Account</h2>
        <form id="editForm" class="col-md-6">
          <div class="mb-3">
            <label for="editUsername" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="editUsername"
              required
            />
          </div>
          <div class="mb-3">
            <label for="editEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="editEmail" required />
          </div>
          <div class="mb-3">
            <label for="editHouse" class="form-label">Casata Preferita</label>
            <select class="form-select" id="editHouse">
              <option value="">Nessuna preferenza</option>
              <option value="Gryffindor">Gryffindor</option>
              <option value="Slytherin">Slytherin</option>
              <option value="Ravenclaw">Ravenclaw</option>
              <option value="Hufflepuff">Hufflepuff</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="editPassword" class="form-label"
              >Nuova Password (opzionale)</label
            >
            <input type="password" class="form-control" id="editPassword" />
          </div>
          <button
            type="button"
            class="btn btn-primary me-2"
            onclick="updateAccount()"
          >
            Salva
          </button>
          <button
            type="button"
            class="btn btn-secondary"
            onclick="cancelEdit()"
          >
            Annulla
          </button>
        </form>
      </div>

      <div id="alertMessage" class="alert mt-3" style="display: none"></div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/gestione-account.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
