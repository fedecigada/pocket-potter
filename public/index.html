<!doctype html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Potter - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand ms-3" href="#">Pocket Potter</a>
        <div class="ms-auto">
          <button
            class="btn btn-outline-primary me-2"
            onclick="showLoginForm()"
          >
            Login
          </button>
          <button
            class="btn btn-outline-success"
            onclick="showRegistrationForm()"
          >
            Registrati
          </button>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <div id="loginSection">
            <h1 class="text-center mb-4">Login</h1>
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="loginEmail"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="loginPassword"
                  required
                />
              </div>
              <button
                type="button"
                class="btn btn-primary w-100"
                onclick="handleLogin()"
              >
                Accedi
              </button>
            </form>
          </div>

          <div id="registrationSection" style="display: none">
            <h1 class="text-center mb-4">Registrazione</h1>
            <form id="registrationForm">
              <div class="mb-3">
                <label for="regUsername" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="regUsername"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="regEmail" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="regEmail"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="regPassword" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="regPassword"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="regHouse" class="form-label"
                  >Casata Preferita</label
                >
                <select class="form-select" id="regHouse">
                  <option value="">Nessuna preferenza</option>
                  <option value="Gryffindor">Gryffindor</option>
                  <option value="Slytherin">Slytherin</option>
                  <option value="Ravenclaw">Ravenclaw</option>
                  <option value="Hufflepuff">Hufflepuff</option>
                </select>
              </div>
              <button
                type="button"
                class="btn btn-success w-100"
                onclick="handleRegistration()"
              >
                Registrati
              </button>
            </form>
          </div>

          <div
            id="errorMessage"
            class="alert alert-danger mt-3"
            style="display: none"
          ></div>
          <div
            id="successMessage"
            class="alert alert-success mt-3"
            style="display: none"
          ></div>
        </div>
      </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
