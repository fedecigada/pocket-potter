<!doctype html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Potter - Apertura Pacchetto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/pack-opening.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="text-center mb-4">
        <h2>Apertura Pacchetto</h2>
        <p>
          Carta <span id="currentCard">1</span> di
          <span id="totalCards">5</span>
        </p>
      </div>

      <div class="card-container mb-4">
        <div class="card hero-card">
          <img id="cardImage" src="" class="card-img-top" alt="Card" />
          <div class="card-body text-center">
            <h5 id="cardName" class="card-title"></h5>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-center gap-3">
        <button onclick="prevCard()" class="btn btn-secondary">
          <i class="bi bi-arrow-left"></i> Precedente
        </button>
        <a href="shop.html" class="btn btn-primary">Torna allo Shop</a>
        <button onclick="nextCard()" class="btn btn-secondary">
          Successiva <i class="bi bi-arrow-right"></i>
        </button>
      </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/pack-opening.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
