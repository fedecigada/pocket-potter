<!doctype html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Potter - Proponi Scambio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand ms-3" href="dashboard.html">Pocket Potter</a>
        <span id="welcomeMessage" class="navbar-text ms-2"></span>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item me-3">
              <span class="navbar-text">
                Crediti: <span id="userCredits" class="fw-bold">0</span>
              </span>
            </li>
            <li class="nav-item dropdown">
              <button
                class="nav-link dropdown-toggle btn"
                type="button"
                id="accountDropdown"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Account
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="gestione-account.html"
                    >Gestione Account</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="#" onclick="handleLogout()"
                    >Logout</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="row">
        <div class="col-12">
          <h2>Proponi Scambio</h2>
          <a href="scambi.html" class="btn btn-outline-secondary mb-4">
            <i class="bi bi-arrow-left"></i> Torna agli Scambi
          </a>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-body">
              <form id="exchangeForm">
                <div class="mb-4">
                  <label for="offeredCard" class="form-label"
                    >Carta da Offrire</label
                  >
                  <select class="form-select" id="offeredCard" required>
                    <option value="">Seleziona una carta</option>
                  </select>
                  <small class="text-muted"
                    >Seleziona una delle tue carte duplicate da scambiare</small
                  >
                </div>

                <div class="mb-4">
                  <label for="requestedCard" class="form-label"
                    >Carta da Richiedere</label
                  >
                  <select class="form-select" id="requestedCard" required>
                    <option value="">Seleziona una carta</option>
                  </select>
                  <small class="text-muted"
                    >Seleziona la carta che desideri ricevere in cambio</small
                  >
                </div>

                <div class="alert alert-danger d-none" id="errorMessage"></div>
                <div
                  class="alert alert-success d-none"
                  id="successMessage"
                ></div>

                <button
                  type="submit"
                  class="btn btn-primary w-100"
                  id="submitButton"
                >
                  Proponi Scambio
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/proponi-scambio.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
