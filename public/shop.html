<!doctype html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Potter - Shop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand ms-3" href="dashboard.html">Pocket Potter</a>
        <span id="welcomeMessage" class="navbar-text ms-2"></span>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item me-3">
              <span class="navbar-text">
                Crediti: <span id="userCredits" class="fw-bold">0</span>
              </span>
            </li>
            <li class="nav-item dropdown">
              <button
                class="nav-link dropdown-toggle btn"
                type="button"
                id="accountDropdown"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Account
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="gestione-account.html"
                    >Gestione Account</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="#" onclick="handleLogout()"
                    >Logout</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <h2 class="mb-4">Shop</h2>
      <div class="row g-4">
        <div class="col-md-6 col-lg-3">
          <div class="card h-100">
            <div class="card-body text-center">
              <h5 class="card-title">Acquista Crediti</h5>
              <p class="card-text">Aggiungi 1 credito al tuo account</p>
              <button onclick="buyCredits()" class="btn btn-primary">
                Acquista (1€)
              </button>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card h-100">
            <div class="card-body text-center">
              <h5 class="card-title">Pacchetto Base</h5>
              <p class="card-text">5 carte casuali</p>
              <button onclick="buyPack()" class="btn btn-primary">
                Acquista (1 credito)
              </button>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card h-100">
            <div class="card-body text-center">
              <h5 class="card-title">Pacchetto Maxi</h5>
              <p class="card-text">9 carte casuali</p>
              <button onclick="buyMaxiPack()" class="btn btn-primary">
                Acquista (1.5 crediti)
              </button>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card h-100">
            <div class="card-body text-center">
              <h5 class="card-title">Vendi Carte</h5>
              <p class="card-text">Vendi le tue carte duplicate</p>
              <a href="sell.html" class="btn btn-primary">Vendi</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/shop.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
